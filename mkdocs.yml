site_name: Manuale Attestazione Trasparenza 2026
site_description: Guida operativa per l’attestazione degli obblighi di trasparenza
site_author: Lab4Srl
site_url: https://lab4srl.github.io/manuale-trasparenza-2026/

theme:
  name: material
  language: it
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  features:
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - css/extra.css

nav:
  - Premessa: index.md
  - Link utili: link-utili.md
  - 1. Indicazioni operative per le Amministrazioni e gli Enti per lo svolgimento dell’attestazione:
      - Introduzione: capitolo-1/index.md
      - 1.1 Dati non pubblicabili, eccezioni e specificità nella pubblicazione: capitolo-1/1-1-dati-non-pubblicabili.md
      - 1.2 Aggiornamento delle pubblicazioni: capitolo-1/1-2-aggiornamento-pubblicazioni.md
      - 1.3 Durata delle pubblicazioni: capitolo-1/1-3-durata-pubblicazioni.md
      - 1.4 Formato aperto dei dati: capitolo-1/1-4-formato-aperto.md
  - 2. Indicazioni operative per gli Organismi di valutazione per lo svolgimento dell’attestazione:
      - Introduzione: capitolo-2/index.md
      - 2.1 Ambito temporale di riferimento degli obblighi di pubblicazione oggetto di attestazione: capitolo-2/2-1-ambito-temporale.md
      - 2.2 Applicativo web: capitolo-2/2-2-applicativo-web.md
  - 3. Attività di controllo interno sul corretto assolvimento degli obblighi di pubblicazione e successivo monitoraggio: capitolo-3/index.md
  - 4. Tabelle, schemi e indicazioni operative per assolvere correttamente agli obblighi di pubblicazione oggetto di attestazione per l’anno 2025:
      - 4.1 Atti generali (art. 12): capitolo-4/4-1-atti-generali.md
      - 4.2 Organizzazione (art. 13 e art. 14): capitolo-4/4-2-organizzazione.md
      - 4.3 Consulenti e collaboratori (art. 15): capitolo-4/4-3-consulenti-collaboratori.md
      - 4.4 Personale – Titolari di incarichi amministrativi di vertice e dirigenziali (art. 20 del d.lgs. 39/2013): capitolo-4/4-4-personale-vertice-dirigenziali.md
      - 4.5 Performance (art. 20): capitolo-4/4-5-performance.md
      - 4.6 Attività e procedimenti (art. 35): capitolo-4/4-6-attivita-procedimenti.md
      - 4.7 Provvedimenti (art. 23): capitolo-4/4-7-provvedimenti.md
      - 4.8 Sovvenzioni, contributi, sussidi, vantaggi economici (artt. 26-27): capitolo-4/4-8-sovvenzioni-contributi.md
      - 4.9 Bilanci (art. 29): capitolo-4/4-9-bilanci.md
      - 4.10 Controlli e rilievi sull'amministrazione (art. 31): capitolo-4/4-10-controlli-rilievi.md
      - 4.11 Servizi erogati (art. 32): capitolo-4/4-11-servizi-erogati.md
      - 4.12 Pagamenti dell’amministrazione (art. 4-bis e art. 36): capitolo-4/4-12-pagamenti.md
      - 4.13 Bandi di gara e contratti: capitolo-4/4-13-bandi-gara-contratti.md
      - 4.14 Pianificazione e governo del territorio (art. 39): capitolo-4/4-14-pianificazione-territorio.md
      - 4.15 Interventi straordinari e di emergenza (art. 42): capitolo-4/4-15-interventi-straordinari.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
